services:
  dvm:
    build: .
    env_file: .env
    volumes:
      - dvm-data:/app/data
      - dvm-temp:/app/temp
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  dvm-data:
  dvm-temp:
  ollama-data:
