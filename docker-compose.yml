services:
  dvm:
    build: .
    env_file: .env
    volumes:
      - dvm-data:/app/data
      - dvm-temp:/app/temp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/data/healthcheck && find /app/data/healthcheck -mmin -2 | grep -q ."]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  dvm-data:
  dvm-temp:
  ollama-data:
